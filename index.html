</header>

<main id="app" class="wrap">

  <!-- FILTRY -->
  <section class="filters">
    <span class="filters-label">Nastavení filtru:</span>
    <select id="filterClient" class="filter-pill"></select>
    <select id="filterStatus" class="filter-pill"></select>
    <select id="totalsScope" class="filter-pill">
      <option value="ME">Součty: Já</option>
      <option value="ALL">Součty: Všichni</option>
    </select>
    <div class="menuAnchor">
      <button id="assigneeFilterBtn" class="filter-pill filter-pill-btn">Grafik: Všichni</button>
      <div id="assigneeFilterMenu" class="dropdown-menu" hidden>
        <label class="dropdown-item"><input type="checkbox" value="Viki"> Viki</label>
        <label class="dropdown-item"><input type="checkbox" value="Standa"> Standa</label>
        <label class="dropdown-item"><input type="checkbox" value="Marek"> Marek</label>
        <div class="dropdown-footer">
          <button id="assigneeFilterClear" class="btn-sm" type="button">Vymazat</button>
          <button id="assigneeFilterClose" class="btn-sm" type="button">Zavřít</button>
        </div>
      </div>
    </div>
  </section>

  <!-- TABULKA -->
  <section class="tableWrap">
    <table class="grid">
      <thead>
        <tr class="headrow">
          <th class="th-client">Klient</th>
          <th class="th-job">Zakázka</th>
          <th class="th-status">Status</th>
          <th class="th-assignee">Grafik</th>
          <th class="th-del"></th>
          <th class="th-day">Po</th>
          <th class="th-day">Út</th>
          <th class="th-day">St</th>
          <th class="th-day">Čt</th>
          <th class="th-day">Pá</th>

        <p class="modal-sub" id="modalUserEmail"></p>

    </div>
    <div class="modal-body">
      <!-- Zobrazené jméno -->

      <!-- Změna hesla -->
      <div class="form-section-divider"></div>
      <p class="form-section-title">Změna hesla</p>

      <input id="userNewPass1" type="password" class="form-input" placeholder="Nové heslo"/>
      <label class="form-label" style="margin-top:12px;">Zopakovat heslo</label>
      <input id="userNewPass2" type="password" class="form-input" placeholder="Zopakovat heslo"/>
      <p id="userPassMsg" class="auth-msg" style="display:none; margin-top:8px;"></p>
    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <button id="btnUserLogout" class="btn-danger">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 5l3 3-3 3M13 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Odhlásit
      </button>
      <div style="display:flex;gap:10px;">
        <button class="btn-ghost" data-close="modalUser">Zavřít</button>
        <button id="btnUserSavePass" class="btn-primary">Uložit heslo</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="auth.js"></script>
<script>
  // Modal helpers
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.close).style.display = 'none';
    });
  });
  document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) backdrop.style.display = 'none';
    });
  });

  document.getElementById('btnAddClient').addEventListener('click', () => {
    document.getElementById('modalClient').style.display = 'flex';
  });
  document.getElementById('btnAddJob').addEventListener('click', () => {
    document.getElementById('modalJob').style.display = 'flex';
  });
  document.getElementById('btnExport').addEventListener('click', () => {
    if (typeof exportExcel === 'function') exportExcel();
  });

  // Align footer bubbles under the header day-columns
  function alignFooterBubbles() {
    const ths = document.querySelectorAll('.grid thead th.th-day');
    const footerWrap = document.querySelector('.sum-footer-wrap');
    if (!ths.length || !footerWrap) return;

    // Bubbles are absolute children of footerWrap (via display:contents on sum-footer-bubbles)
    const wrapRect = footerWrap.getBoundingClientRect();

    ths.forEach((th, i) => {
      const bubble = document.getElementById('sumBubble' + i);
      if (!bubble) return;
      const thRect = th.getBoundingClientRect();
      // Center of the th column, expressed as offset from footerWrap's left edge
      const center = thRect.left + thRect.width / 2 - wrapRect.left;
      bubble.style.left = Math.round(center) + 'px';
    });
  }

  // Run on load and on resize
  window.addEventListener('resize', alignFooterBubbles);
  // Run after initial render (tables need to be painted first)
  requestAnimationFrame(() => requestAnimationFrame(alignFooterBubbles));
  // Also expose for app.js to call after table renders
  window.alignFooterBubbles = alignFooterBubbles;

  // User modal
  document.getElementById('btnUserMenu').addEventListener('click', () => {
    // Populate user info
    const email = window.__currentUserEmail || '';
    document.getElementById('modalUserEmail').textContent = email;
    const displayName = (typeof nameFromEmail === 'function') ? nameFromEmail(email) : email.split('@')[0];
    document.getElementById('userDisplayName').value = displayName;
    document.getElementById('userNewPass1').value = '';
    document.getElementById('userNewPass2').value = '';
    const msg = document.getElementById('userPassMsg');
    msg.style.display = 'none';
    document.getElementById('modalUser').style.display = 'flex';
  });

  document.getElementById('btnUserSavePass').addEventListener('click', async () => {
    const p1 = document.getElementById('userNewPass1').value;
    const p2 = document.getElementById('userNewPass2').value;
    const msg = document.getElementById('userPassMsg');
    msg.style.display = 'none';
    if (!p1 || !p2) { msg.textContent = 'Vyplň obě pole.'; msg.style.display = 'block'; msg.style.color = '#c00'; return; }
    if (p1 !== p2) { msg.textContent = 'Hesla se neshodují.'; msg.style.display = 'block'; msg.style.color = '#c00'; return; }
    if (p1.length < 6) { msg.textContent = 'Heslo musí mít aspoň 6 znaků.'; msg.style.display = 'block'; msg.style.color = '#c00'; return; }
    try {
      const sb = window.__sb || (typeof state !== 'undefined' && state.sb);
      if (!sb) throw new Error('Supabase není inicializováno');
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) throw error;
      msg.textContent = 'Heslo bylo úspěšně změněno.';
      msg.style.color = '#0a7d2a';
      msg.style.display = 'block';
      document.getElementById('userNewPass1').value = '';
      document.getElementById('userNewPass2').value = '';
    } catch(e) {
      msg.textContent = e.message || 'Změna hesla selhala.';
      msg.style.color = '#c00';
      msg.style.display = 'block';
    }
  });

  document.getElementById('btnUserLogout').addEventListener('click', async () => {
    try {
      const sb = window.__sb || (typeof state !== 'undefined' && state.sb);
      if (sb) await sb.auth.signOut();
    } catch(e) {}
    location.reload();
  });
</script>
</body>
</html>
